name: Firmware bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: esp32p4-chip-rev-v3
            target: esp32p4
            defaults: "sdkconfig.defaults"
          - variant: esp32p4-chip-rev-v1
            target: esp32p4
            defaults: "sdkconfig.defaults;sdkconfig.defaults.rev_v1"
          - variant: esp32s3
            target: esp32s3
            defaults: "sdkconfig.defaults"
    steps:
      - uses: actions/checkout@v4

      - name: Build (ESP-IDF v5.5.4)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: ${{ matrix.target }}
          command: idf.py -DSDKCONFIG_DEFAULTS="${{ matrix.defaults }}" build merge-bin

      - name: Firmware einsammeln
        run: |
          mkdir -p out
          cp build/merged-binary.bin out/P4-ETH-RTSP-Cam-MK1-${{ matrix.variant }}-merged.bin
          cp build/p4_eth_rtsp_cam_mk1.bin out/P4-ETH-RTSP-Cam-MK1-${{ matrix.variant }}-app.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: out/*.bin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
