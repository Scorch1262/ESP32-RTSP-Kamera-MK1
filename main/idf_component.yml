dependencies:
  idf: ">=5.4,<6.0"
  # ESP32-P4: V4L2-Kameraframework inkl. MIPI-CSI- und OV5640-Treiber
  espressif/esp_video:
    version: "~2.6.0"
    rules:
      - if: "target == esp32p4"
  # ESP32-P4: SCCB-Zugriff fuer die Kamera-Einstellungen (kommt ohnehin mit esp_video)
  espressif/esp_sccb_intf:
    version: "*"
    rules:
      - if: "target == esp32p4"
  # ESP32-P4: Hardware-H.264-Encoder
  espressif/esp_h264:
    version: "1.4.*"
    rules:
      - if: "target == esp32p4"
  # ESP32-S3: DVP-Kameratreiber (OV5640, OV2640, ...)
  espressif/esp32-camera:
    version: ">=2.0.0,<3.0.0"
    rules:
      - if: "target == esp32s3"
  # ESP32-S3: JPEG-Dekoder fuer die Bewegungserkennung
  espressif/esp_jpeg:
    version: "^1.3.1"
    rules:
      - if: "target == esp32s3"
